# Disposable local acdp-registry-rs for the integration tests: Postgres + the
# released GHCR image, auth off, did:key producers allowed. Never deploy this.
#
#   docker compose -f tests/integration/compose.yml up -d --wait
#   ACDP_IT_REGISTRY=http://localhost:8443 pytest -m integration
#
# The image is linux/amd64 only; on arm64 it runs under emulation.
name: acdp-agent-hooks-it

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acdp
      POSTGRES_PASSWORD: acdp
      POSTGRES_DB: acdp_registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acdp -d acdp_registry"]
      interval: 2s
      timeout: 5s
      retries: 30

  registry:
    image: ghcr.io/agentcontextdistributionprotocol/acdp-registry:${ACDP_REGISTRY_VERSION:-0.6.1}
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ACDP_REGISTRY_STORAGE__BACKEND: postgres
      ACDP_REGISTRY_STORAGE__POSTGRES_URL: postgres://acdp:acdp@postgres:5432/acdp_registry
      ACDP_REGISTRY_REGISTRY__AUTHORITY: localhost
      ACDP_REGISTRY_REGISTRY__BIND: 0.0.0.0
      ACDP_REGISTRY_REGISTRY__PORT: "8443"
      ACDP_REGISTRY_REGISTRY__ALLOW_PUBLIC_BIND: "true"
      ACDP_REGISTRY_REGISTRY__PROFILES: acdp-registry-core,acdp-registry-discovery
      ACDP_REGISTRY_AUTH__ENABLED: "false"
      ACDP_REGISTRY_AUTH__ANONYMOUS_PUBLIC_READS: "true"
      ACDP_REGISTRY_AUTH__DID_METHODS: did:web,did:key
      ACDP_REGISTRY_AUTH__TENANT_HEADER_TRUST: none
      ACDP_REGISTRY_RATE_LIMIT__ENABLED: "false"
      RUST_LOG: info
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8443 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
